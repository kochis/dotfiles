# Options
set -g default-terminal "screen-256color"
set -g base-index 1
set -g pane-base-index 1
set -g set-titles on
set -g status-keys vi
# Faster Command Sequences
set -sg escape-time 0

set -g mouse on
set -g set-clipboard on

# set scrollback buffer to 100,000 lines
set-option -g history-limit 100000

# New windows/panes start a login shell (bash, see check_shell.sh) so
# ~/.bash_profile is sourced. reattach-to-user-namespace is no longer needed
# on modern macOS; pbcopy/pbpaste work directly (see copy/paste bindings below).

# neovim settings (from running :checkhealth)
set-option -g focus-events on
# Enable true color. The override must match the TERM *outside* tmux
# (iTerm2 / Terminal.app set xterm-256color).
set-option -sa terminal-overrides ',xterm-256color:RGB'

# Window options
setw -g mode-keys vi # vi key
setw -g xterm-keys on
setw -g automatic-rename on
setw -g monitor-activity on
setw -g aggressive-resize on

# Style
set -g status-bg default
set -g status-fg default
set -g status-left ""
set -g status-right "#[fg=green]#H"
#set -g status-position bottom

set -g pane-active-border-style fg=blue,bg=default
set -g pane-border-style fg=white,bg=default

set -g display-panes-active-colour red
set -g display-panes-colour blue

# Highlight active window
setw -g window-status-current-style bg=red,fg=default

# remap prefix to Control + f
set -g prefix C-f
unbind C-b
bind C-f send-prefix

# force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# copy mode
unbind p
bind p paste-buffer
bind -T copy-mode-vi 'v' send-keys -X begin-selection
bind -T copy-mode-vi 'r' send-keys -X rectangle-toggle
bind -T copy-mode-vi 'y' send-keys -X copy-selection

# quick pane cycling
unbind ^F
bind ^F select-pane -t :.+

# zoom (toggle; prefix-z also works by default)
unbind ^M
bind ^M resize-pane -Z

# switch panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# splits
bind s split-window -v
bind v split-window -h

# resize panes
bind ^L resize-pane -R 5
bind ^J resize-pane -D 5
bind ^K resize-pane -U 5
bind ^H resize-pane -L 5

# Copy/paste to system clipboard
# Select text, yank (y), copy to system buffer (Ctrl-f ctrl-c)
bind C-c run "tmux save-buffer - | pbcopy"
bind C-v run "pbpaste | tmux load-buffer - && tmux paste-buffer"
